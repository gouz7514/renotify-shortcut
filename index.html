<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renotify</title>
  <script>
    // 브라우저 언어에 맞춰 /ko/ 또는 /en/으로 보낸다.
    location.replace(/^ko\b/i.test(navigator.language) ? "ko/" : "en/");
  </script>
</head>
<body></body>
</html>
