<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>자주 묻는 질문 · 알림함</title>
    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body class="doc">
    <main>
      <header>
        <h1>자주 묻는 질문</h1>
        <a class="switch" href="../../en/faq/" lang="en">English</a>
      </header>

      <details open>
        <summary>iOS 몇 버전부터 쓸 수 있나요?</summary>
        <p>
          <b>iOS 27 이상</b>에서 쓸 수 있어요. 받은 알림으로 단축어를 실행하는
          '알림' 자동화가 iOS 27부터 생겼기 때문이에요.
        </p>
      </details>

      <details>
        <summary>알림 정보는 어디에 저장되나요?</summary>
        <p>
          <b>내 iPhone 안에만</b> 저장돼요. 알림 내용은 서버로 보내지 않고,
          계정이나 광고, 추적도 없어요.
        </p>
      </details>

      <details>
        <summary>휴대폰을 바꾸면 기록은 어떻게 되나요?</summary>
        <ul>
          <li>
            <b>iCloud 백업이나 기기 간 이전</b>으로 새 iPhone에 옮기면 기록도
            함께 옮겨져요.
          </li>
          <li>앱을 재설치하는 경우 기록은 사라져요.</li>
        </ul>
      </details>
    </main>
  </body>
</html>
